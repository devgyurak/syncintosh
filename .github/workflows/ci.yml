name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Format check
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run ty check

  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is included on purpose: keychain, launchd, and mdfind behavior is macOS-only.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # The `zsh` preset's validator runs `zsh -fn` on a merge result and before every write, and
      # the CLI always wires the real checker, so the suite needs a `zsh` on PATH. The Ubuntu
      # runner image does not ship one (macOS has it as `/bin/zsh`), and installing it here is
      # what keeps the checker real instead of a stub the tests could pass with a broken one.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Sync
        run: uv sync --all-extras --python ${{ matrix.python }}
      - name: Unit + integration (coverage gate 90%)
        run: uv run pytest

  integration:
    name: integration presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Presence check for the integration suite. Only the coverage floor is relaxed
      # (--cov-fail-under=0); every other addopt stays on, so --disable-socket (the
      # no-network rule) and --strict-markers keep applying. Missing integration tests make
      # pytest exit 5, so this fails. The real coverage gate is the `test` job above and is
      # never disabled.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: uv sync --all-extras
      - name: Integration tests must exist and pass
        run: uv run pytest -m integration --cov-fail-under=0 -q
